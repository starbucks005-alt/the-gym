[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

  # gym-chat can now check a real source before it answers, on top of the
  # model call. 26s is the platform ceiling; it keeps a slow lookup plus a
  # slow reply from being cut off as a 504, the way study design was.
  [functions."gym-chat"]
    timeout = 26

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[dev]
  port = 8888
  publish = "."
